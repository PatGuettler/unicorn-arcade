name: Deploy Godot Android - Internal Test

on:
  push:
    branches:
      - godot-port
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  GODOT_CHANNEL: stable
  EXPORT_PRESET: Android Alpha

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: godot/.godot
          key: godot-import-${{ runner.os }}-${{ hashFiles('godot/**/*.import', 'godot/project.godot', 'godot/export_presets.cfg') }}
          restore-keys: |
            godot-import-${{ runner.os }}-

      - name: Cache Gradle (Android export)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('godot/android/build/**/*.gradle*', 'godot/export_presets.cfg') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Installing Android cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/android-cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -qo /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/android-cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # pipefail + `yes` → SIGPIPE (141) when sdkmanager exits; do not fail the step
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Install Godot export tooling
        run: |
          chmod +x scripts/ci/godot-export-android.sh
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/release.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/release.keystore" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "Alias name:"

      - name: Export Godot Android (AAB + debug APK)
        env:
          VERSION_CODE: ${{ github.run_number }}
          ADMOB_ADS_ENABLED: "true"
          ADMOB_BANNER_UNIT_ID: ca-app-pub-3940256099942544/6300978111
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./scripts/ci/godot-export-android.sh

      - name: Upload debug APK (install on phone)
        uses: actions/upload-artifact@v4
        with:
          name: UnicornArcade-debug-apk
          path: godot/build/android/UnicornArcade-debug.apk
          if-no-files-found: error

      - name: Upload to Play Store Internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.grapegames.wlarcade
          releaseFiles: godot/build/android/UnicornArcade.aab
          track: internal
          status: completed
