name: Deploy Godot Android - Internal Test

on:
  push:
    branches:
      - godot-port
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  GODOT_CHANNEL: stable
  EXPORT_PRESET: Android Alpha

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Install Godot export tooling
        run: |
          chmod +x scripts/ci/godot-export-android.sh
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/release.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/release.keystore" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "Alias name:"

      - name: Export Godot Android (AAB + debug APK)
        env:
          VERSION_CODE: ${{ github.run_number }}
          ADMOB_ADS_ENABLED: "true"
          ADMOB_BANNER_UNIT_ID: ca-app-pub-3940256099942544/6300978111
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./scripts/ci/godot-export-android.sh

      - name: Upload debug APK (install on phone)
        uses: actions/upload-artifact@v4
        with:
          name: UnicornArcade-debug-apk
          path: godot/build/android/UnicornArcade-debug.apk
          if-no-files-found: error

      - name: Upload to Play Store Internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.grapegames.wlarcade
          releaseFiles: godot/build/android/UnicornArcade.aab
          track: internal
          status: completed
