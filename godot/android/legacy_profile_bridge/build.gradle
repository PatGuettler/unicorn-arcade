plugins {
    id 'com.android.library' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
}

android {
    namespace 'com.guettler.unicornarcade'
    compileSdkVersion 36
    defaultConfig { minSdkVersion 23 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    // Export script supplies the exact Godot AAR generated by its template.
    compileOnly files(System.getenv('GODOT_ANDROID_LIBRARY_AAR'))
}

tasks.register('copyReleaseAar', Copy) {
    dependsOn 'bundleReleaseAar'
    from layout.buildDirectory.file('outputs/aar/legacy_profile_bridge-release.aar')
    into System.getenv('LEGACY_BRIDGE_OUTPUT_DIR')
    rename { 'legacy_profile_bridge.aar' }
}
